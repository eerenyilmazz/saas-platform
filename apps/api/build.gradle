plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.4.0.8496'
}

group = 'com.saas'
version = '0.0.1-SNAPSHOT'
description = 'Modular SaaS - api'

// static-analysis.md's code-quality/complexity layer (SonarCloud). Run with ./gradlew sonar -
// needs SONAR_TOKEN in the environment (CI: the SONAR_TOKEN repo secret; locally: your own token
// from sonarcloud.io/account/security).
sonar {
	properties {
		property "sonar.projectKey", "eerenyilmazz_saas-platform"
		property "sonar.organization", "eerenyilmazz"
		property "sonar.host.url", "https://sonarcloud.io"
		// Without this, SonarCloud has no coverage data at all and reports a flat 0% - not "low
		// coverage", no data - which is what was tripping the "Coverage on New Code >= 80%" gate
		// unconditionally. Pointing it at JaCoCo's own XML report makes that condition reflect
		// what's actually tested, not the absence of any measurement.
		property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring Boot 4.1.0's managed BOM does not yet pin a testcontainers version (resolves empty) -
// importing the testcontainers-bom directly until Spring's own BOM catches up.
dependencyManagement {
	imports {
		mavenBom 'org.testcontainers:testcontainers-bom:1.21.3'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// api-documentation.md: OpenAPI schema generated from controllers/DTOs, never hand-written.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
	// Order matters: MapStruct's processor needs to see Lombok-generated getters/setters, so
	// Lombok's processor must run first - this binding enforces that instead of leaving it to
	// whatever order the two happen to be declared in.
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testCompileOnly 'org.projectlombok:lombok:1.18.46'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.jacocoTestReport
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.test
	reports {
		xml.required = true
	}
}

tasks.named('sonar') {
	dependsOn tasks.jacocoTestReport
}
