# Local development profile - matches infra/docker/docker-compose.yml
# ddl-auto and flyway.enabled are set in the base application.properties (apply to every profile)

# Flyway runs migrations as the superuser (needs CREATE ROLE / DDL). This is a separate
# datasource config from spring.datasource.* below - see V202607171821__create_application_role.sql
# for why the application itself never connects as this role.
spring.flyway.url=jdbc:postgresql://localhost:5433/saas_platform
spring.flyway.user=saas
spring.flyway.password=${DB_PASSWORD:local_dev_only}
# Resolves the ${app_role_password} placeholder in V202607171821__create_application_role.sql -
# keep in sync with spring.datasource.password below, same underlying credential.
spring.flyway.placeholders.app_role_password=${DB_APP_PASSWORD:saas_app_local_dev_only}

# Application runtime connects as the unprivileged role RLS actually applies to.
spring.datasource.url=jdbc:postgresql://localhost:5433/saas_platform
spring.datasource.username=saas_app
spring.datasource.password=${DB_APP_PASSWORD:saas_app_local_dev_only}

# Local dev only, same DB_* env var fallback pattern as above - see security.md for the
# real-deployment requirement (JWT_SECRET must be set, no fallback outside local).
app.jwt.secret=${JWT_SECRET:local-dev-only-jwt-signing-secret-do-not-use-in-production}
