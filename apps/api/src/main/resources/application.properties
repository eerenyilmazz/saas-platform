spring.application.name=api

# Flyway is the only source of schema truth (database-conventions.md) - Hibernate must never
# create/alter tables itself, in any profile, or RLS/index/constraint clauses that only exist
# in migration SQL (not expressible via JPA annotations) would silently disappear.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Open Session In View (Spring Boot's default) would check a connection out at the start of every
# request and hold it for the whole request - before TenantContext is populated per-request, and
# before TenantAwareDataSource's per-checkout stamping would see the right value. Disabling it
# means a connection is only acquired once a @Transactional method actually queries something,
# by which point JwtAuthenticationFilter/AuthenticationService has already set TenantContext.
spring.jpa.open-in-view=false

# see docs/infra/observability.md - /health endpoint also checks DB connectivity
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# app.jwt.secret is intentionally not set here - every profile must supply it itself (JWT_SECRET
# env var in real deployments, application-local.properties for local dev, @DynamicPropertySource
# in AbstractIntegrationTest for tests), see security.md.
app.jwt.access-token-ttl=20m
app.jwt.refresh-token-ttl=30d

# security.md's login brute-force protection defaults.
app.login-rate-limit.max-attempts=5
app.login-rate-limit.window=1m
app.login-rate-limit.lockout-duration=15m

# api-documentation.md's dev-only reference UI.
springdoc.swagger-ui.path=/api/v1/docs
